name: Build Madar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  PRESET: "Android Debug"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d tpl
          mv tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf godot.zip templates.tpz tpl

      - name: Install Android SDK parts
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Restore debug keystore (keeps the same signature between builds)
        id: ks_cache
        uses: actions/cache@v4
        with:
          path: ~/debug.keystore
          key: madar-debug-keystore-v1

      - name: Create debug keystore
        if: steps.ks_cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot for Android export
        run: |
          set -e
          mkdir -p "$HOME/.config/godot"
          CFG="$HOME/.config/godot/editor_settings-4.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_SDK\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$CFG"
          cp "$CFG" "$HOME/.config/godot/editor_settings-4.7.tres"

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Export APK
        run: |
          set -e
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          mkdir -p build
          godot --headless --path . --export-debug "$PRESET" build/madar-debug.apk
          test -s build/madar-debug.apk
          ls -lh build

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: madar-debug-apk
          path: build/madar-debug.apk

      - name: Publish APK to a release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Madar debug (latest)
          prerelease: true
          files: build/madar-debug.apk
